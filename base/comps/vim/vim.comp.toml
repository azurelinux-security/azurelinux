# Disable optional gpm (console-mouse) support so that we can demote
# the gpm SRPM entirely to sdk. vim.spec uses bcond gating for GPM
# (default ON when fedora is set); flip it off via build.without.
[components.vim]
build.without = ["gpm"]

[[components.vim.overlays]]
description = "Fix CVE-2026-55892 — https://github.com/vim/vim/commit/8325b193bba5f01e7a7d8241f"
type = "file-add"
file = "CVE-2026-55892.patch"
source = "CVE-2026-55892.patch"

[[components.vim.overlays]]
description = "Register CVE-2026-55892 patch as Patch10001"
type = "spec-insert-tag"
tag = "Patch10001"
value = "CVE-2026-55892.patch"

[[components.vim.overlays]]
description = "Apply CVE-2026-55892 patch (CVE-2026-55892.patch)"
type = "spec-append-lines"
section = "%prep"
lines = [
    "%patch -P10001 -p1",
]

